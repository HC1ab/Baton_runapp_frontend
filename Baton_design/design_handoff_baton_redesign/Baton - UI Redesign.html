<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Baton — UI Redesign</title>
<link rel="preconnect" href="https://fastly.jsdelivr.net" />
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="baton.css?v=7" />
</head>
<body>
<div class="canvas">
  <header class="canvas-head">
    <div class="canvas-eyebrow">Baton · Visual Refresh</div>
    <h1 class="canvas-title">Baton — 모던 리디자인</h1>
    <p class="canvas-sub">기존 오렌지 컬러 시스템은 그대로 유지하고, 형태·간격·타이포·컴포넌트를 더 모던하고 정제된 다크 UI로 통일했습니다. 전체 5개 화면.</p>
  </header>

  <div class="gallery" id="gallery"></div>
</div>

<!-- =========================================================
     SCREEN TEMPLATES — each .screen is rendered into a phone
========================================================= -->

<!-- ① 러닝 / 라이브 -->
<template id="scr-running">
  <div class="map map-warm">__MAP_RUN__</div>
  <div class="run-haze"></div>

  <div class="body" style="padding:4px 16px 0; z-index:10;">
    <!-- mock runner control -->
    <section class="mock card">
      <div class="mock-head">
        <span class="mock-dot"></span>
        <span class="mock-title">Mock Runner</span>
      </div>
      <div class="mock-speed">속도 3.33 m/s · 5'00" /km</div>
      <div class="pace-row">
        <button class="pace">6'00</button>
        <button class="pace on">5'00</button>
        <button class="pace">4'00</button>
        <button class="pace">3'00</button>
      </div>
      <div class="mock-actions">
        <button class="auto-btn">__ICON_PLAY__ 자동 이동</button>
        <button class="mini-btn">__ICON_ARROW__</button>
      </div>
    </section>
  </div>

  <!-- runner puck + play -->
  <div class="live-stack">
    <div class="puck-ground"></div>
    <div class="puck">
      <div class="orb puck-orb"></div>
      <div class="puck-pin">__ICON_PIN_SM__</div>
    </div>
    <button class="play-fab">__ICON_PLAY_LG__</button>
  </div>

  <div class="tabbar" data-nav="0"></div>
</template>

<!-- ② 스팟 -->
<template id="scr-spot">
  <div class="body"><div class="body-scroll">
    <div style="height:8px;"></div>
    <div class="eyebrow">Spot</div>
    <h1 class="page-title" style="margin-top:8px;">내가 방문한 스팟</h1>

    <div class="spot-list">
      <article class="spot card">
        <div class="spot-main">
          <div class="spot-ic">__ICON_PIN__</div>
          <div class="spot-info">
            <h3>구서동 중앙천로 산책로</h3>
            <p>마지막 방문 · 2026.06.08</p>
          </div>
          <div class="ring" style="--p:100;"><svg class="ring-svg" viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.6"/><circle class="ring-fg" cx="18" cy="18" r="15.6" pathLength="100"/></svg><span>00:20:33</span></div>
        </div>
        <div class="spot-foot">
          <span class="badge exp">__ICON_BOLT__ +15 EXP</span>
          <span class="badge pt">__ICON_COIN__ 50 P</span>
        </div>
      </article>

      <article class="spot card">
        <div class="spot-main">
          <div class="spot-ic">__ICON_PIN__</div>
          <div class="spot-info">
            <h3>구서역 GS 편의점</h3>
            <p>마지막 방문 · 2026.06.08</p>
          </div>
          <div class="ring" style="--p:78;"><svg class="ring-svg" viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.6"/><circle class="ring-fg" cx="18" cy="18" r="15.6" pathLength="100"/></svg><span>00:20:22</span></div>
        </div>
        <div class="spot-foot">
          <span class="badge exp dim">__ICON_BOLT__ +0 EXP</span>
          <span class="badge pt">__ICON_COIN__ 100 P</span>
        </div>
      </article>

      <article class="spot card">
        <div class="spot-main">
          <div class="spot-ic">__ICON_PIN__</div>
          <div class="spot-info">
            <h3>구서역 1번 출구 광장</h3>
            <p>마지막 방문 · 2026.06.08</p>
          </div>
          <div class="ring" style="--p:55;"><svg class="ring-svg" viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.6"/><circle class="ring-fg" cx="18" cy="18" r="15.6" pathLength="100"/></svg><span>00:19:59</span></div>
        </div>
        <div class="spot-foot">
          <span class="badge exp">__ICON_BOLT__ +5 EXP</span>
          <span class="badge pt">__ICON_COIN__ 10 P</span>
        </div>
      </article>
    </div>
    <div class="tab-spacer"></div>
  </div></div>
  <div class="tabbar" data-nav="1"></div>
</template>

<!-- ③ 마이 룸 -->
<template id="scr-room">
  <div class="body"><div class="body-scroll">
    <div style="height:6px;"></div>
    <h1 class="page-title">마이 룸</h1>

    <div class="room-orb-wrap">
      <div class="orb room-orb"></div>
    </div>

    <div class="equip">
      <div class="equip-lbl">Equipped Title</div>
      <span class="title-badge">스피드 킹</span>
    </div>

    <a class="shop">
      <div class="shop-ic">__ICON_SHOP__</div>
      <div class="shop-txt">
        <strong>Baton Shop</strong>
        <span>Get exclusive items</span>
      </div>
      <div class="shop-chev">__ICON_CHEV__</div>
    </a>

    <div class="seg room-seg">
      <button class="on">Core Colors</button>
      <button>Aura</button>
      <button>Titles</button>
      <button>Inventory</button>
    </div>

    <div class="swatch-grid">
      <div class="swatch sel" style="--c:#EC6E2C;">__ICON_CHECK__</div>
      <div class="swatch lock">__ICON_LOCK__</div>
      <div class="swatch lock">__ICON_LOCK__</div>
      <div class="swatch lock">__ICON_LOCK__</div>
      <div class="swatch lock">__ICON_LOCK__</div>
      <div class="swatch" style="--c:#3A57D6;"></div>
      <div class="swatch lock">__ICON_LOCK__</div>
      <div class="swatch lock">__ICON_LOCK__</div>
    </div>
    <div class="tab-spacer"></div>
  </div></div>
  <div class="tabbar" data-nav="3"></div>
</template>

<!-- ④ 활동 / Baton -->
<template id="scr-activity">
  <div class="body"><div class="body-scroll">
    <header class="topbar">
      <button class="icon-btn">__ICON_BACK__</button>
      <span class="brand">Baton</span>
      <button class="icon-btn">__ICON_BELL__</button>
    </header>

    <div class="seg" data-period-seg style="margin-top:6px;">
      <button data-period="week">Week</button>
      <button data-period="month" class="on">Month</button>
      <button data-period="year">Year</button>
    </div>

    <div class="month-row">
      <span data-period-label>June 2026</span> __ICON_CHEV_DOWN__
    </div>

    <section class="card stat-card">
      <div class="stat-lbl">Kilometers</div>
      <div class="stat-big" data-stat-km>6.3<span>km</span></div>
      <div class="stat-trio">
        <div><b data-stat-runs>17</b><span>Runs</span></div>
        <i></i>
        <div><b data-stat-pace>4'58"</b><span>Avg Pace</span></div>
        <i></i>
        <div><b data-stat-time>0:31:17</b><span>Time</span></div>
      </div>
      <div class="bars"><div class="chart" data-chart></div></div>
    </section>

    <h2 class="sec-title">Recent Activities</h2>
    <div class="act-list">
      <article class="act card">
        <div class="act-map">__ROUTE_A__</div>
        <div class="act-info">
          <div class="act-top"><h3>Monday Evening Run</h3><span>Jun 8</span></div>
          <div class="act-stats"><b>0.21</b><em>km</em><b>3'40"</b><em>pace</em><b>0:00:46</b><em>time</em></div>
        </div>
        <div class="act-chev">__ICON_CHEV__</div>
      </article>
      <article class="act card">
        <div class="act-map">__ROUTE_B__</div>
        <div class="act-info">
          <div class="act-top"><h3>Monday Dawn Run</h3><span>Jun 8</span></div>
          <div class="act-stats"><b>1.07</b><em>km</em><b>0'58"</b><em>pace</em><b>0:01:02</b><em>time</em></div>
        </div>
        <div class="act-chev">__ICON_CHEV__</div>
      </article>
      <article class="act card">
        <div class="act-map">__ROUTE_C__</div>
        <div class="act-info">
          <div class="act-top"><h3>Monday Dawn Run</h3><span>Jun 8</span></div>
          <div class="act-stats"><b>0.20</b><em>km</em><b>6'01"</b><em>pace</em><b>0:01:12</b><em>time</em></div>
        </div>
        <div class="act-chev">__ICON_CHEV__</div>
      </article>
    </div>
    <div style="height:24px;"></div>
  </div></div>
</template>

<!-- ⑤ 러닝 상세 -->
<template id="scr-detail">
  <div class="detail-map">
    <div class="map map-warm">__MAP_DETAIL__</div>
    <button class="icon-btn float-back">__ICON_BACK__</button>
    <span class="gmaps">Google</span>
  </div>
  <div class="body"><div class="body-scroll detail-scroll">
    <section class="card detail-stats">
      <div><div class="ds-ic">__ICON_RULER__</div><b>0.21</b><span>km</span></div>
      <i></i>
      <div><div class="ds-ic">__ICON_TIMER__</div><b>0:00:46</b><span>time</span></div>
      <i></i>
      <div><div class="ds-ic">__ICON_GAUGE__</div><b>3'40"</b><span>pace</span></div>
    </section>

    <h2 class="sec-title sm">KM Splits</h2>
    <div class="split">
      <span class="split-l"><i></i>+0.21 km</span>
      <span class="split-r">3'40" <em>/km</em></span>
    </div>
    <div style="height:24px;"></div>
  </div></div>
</template>

<script>

    arrow_up: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>`,

/* ---- procedural dark map ---- */
window.MAPS = {
  run() {
    return `<svg viewBox="0 0 360 760" preserveAspectRatio="xMidYMid slice">
      <rect width="360" height="760" fill="#15110d"/>

  },
  // small route thumbnail for activity cards
  route(seed) {
    const paths = {
      a: "M10 44 C20 30 26 38 34 26 S50 14 58 22",
      b: "M10 40 C18 26 28 34 34 22 S48 30 58 16",
      c: "M12 42 C18 24 30 36 36 24 S46 18 56 24",
    };
    const d = paths[seed] || paths.a;
    // derive endpoints
    const m = d.match(/^M([\d.]+) ([\d.]+)/);
    const sx = m[1], sy = m[2];
    const e = d.match(/([\d.]+) ([\d.]+)$/);
    const ex = e[1], ey = e[2];
    return `<svg viewBox="0 0 68 68" preserveAspectRatio="xMidYMid meet">
      <rect width="68" height="68" rx="14" fill="#120e0b"/>
      <g class="road" stroke-width="6"><path d="M-4 24 L72 14"/><path d="M40 -4 L30 72"/></g>

      <circle cx="${sx}" cy="${sy}" r="4" fill="#36C26B"/>
      <circle cx="${ex}" cy="${ey}" r="4" fill="#E8503A"/>
    </svg>`;
  },
  bars() { return ''; },
  // categorical chart datasets per period
  chartData: {
    week: {
      label: 'Jun 2 – 8',
      km: '8.5', runs: '5', pace: "5'10\"", time: '0:44:02',

      km: '92.4', runs: '140', pace: "5'04\"", time: '7:38:11',
      axis: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
      vals: [4.2, 6.1, 9.4, 12.2, 14.8, 6.3, 0, 0, 0, 0, 0, 0],
      hl: 4
    }
  },
  renderChart(root, period) {
    const d = this.chartData[period];
    const max = Math.max(...d.vals, 0.1);
    const bars = d.vals.map((v) => {
      const empty = v <= 0;
      const h = empty ? 4 : Math.max(7, (v / max) * 100);
      return `<div class="chart-col${empty ? ' empty' : ''}"><div class="bar2" style="height:${h}%"></div></div>`;
    }).join('');
    const axis = d.axis.map((a, i) =>
      `<span class="${i === d.hl ? 'hl' : ''}">${a}</span>`
    ).join('');
    root.innerHTML =
      `<div class="chart-bars${d.sectioned ? ' sectioned' : ''}">${bars}</div>` +
      `<div class="chart-axis">${axis}</div>`;
  }
};

/* Baton — build: assemble phones from templates + assets */
(function () {
  const I = window.ICONS, M = window.MAPS;

  const TOK = {
    __MAP_RUN__: M.run(), __MAP_DETAIL__: M.detail(),
    __ROUTE_A__: M.route('a'), __ROUTE_B__: M.route('b'), __ROUTE_C__: M.route('c'),
    __ICON_PLAY__: I.play, __ICON_PLAY_LG__: I.play_lg, __ICON_ARROW__: I.arrow_up,
    __ICON_PIN_SM__: I.pin_sm, __ICON_PIN__: I.pin, __ICON_BOLT__: I.bolt, __ICON_COIN__: I.coin,
    __ICON_SHOP__: I.shop, __ICON_CHEV__: I.chev, __ICON_CHEV_DOWN__: I.chev_down,
    __ICON_CHECK__: I.check, __ICON_LOCK__: I.lock, __ICON_BACK__: I.back, __ICON_BELL__: I.bell,
    __ICON_RULER__: I.ruler, __ICON_TIMER__: I.timer, __ICON_GAUGE__: I.gauge,
  };

  function fill(html) {
    return html.replace(/__[A-Z_]+__/g, (m) => (m in TOK ? TOK[m] : m));
  }

  const NAV = [
    { ic: 'nav_run',     lbl: '러닝' },
    { ic: 'nav_spot',    lbl: '스팟' },
    { ic: 'nav_social',  lbl: '소셜' },
    { ic: 'nav_home',    lbl: '마이 룸' },
    { ic: 'nav_profile', lbl: '프로필' },
  ];
  function tabbarHTML(active) {
    return NAV.map((t, i) =>
      `<div class="tab ${i === active ? 'active' : ''}">${I[t.ic]}<span class="lbl">${t.lbl}</span></div>`
    ).join('');
  }

  function statusbar(time) {
    return `<div class="statusbar">
      <span class="sb-time">${time}</span>
      <span class="sb-icons">${I.signal}${I.wifi}${I.battery}</span>
    </div>`;
  }

  const SCREENS = [
    { id: 'scr-running',  time: '11:00', n: '01 · Live',       t: '러닝' },
    { id: 'scr-spot',     time: '11:00', n: '02 · Spot',       t: '스팟' },
    { id: 'scr-room',     time: '11:01', n: '03 · My Room',    t: '마이 룸' },
    { id: 'scr-activity', time: '11:01', n: '04 · Activity',   t: '활동' },
    { id: 'scr-detail',   time: '11:01', n: '05 · Run Detail', t: '러닝 상세' },
  ];

  const gallery = document.getElementById('gallery');

  SCREENS.forEach((sc) => {
    const tpl = document.getElementById(sc.id);
    let inner = fill(tpl.innerHTML);

    const wrap = document.createElement('div');
    wrap.className = 'phone-wrap';
    wrap.innerHTML = `
      <div class="phone">
        <div class="screen">
          <div class="island"></div>
          ${statusbar(sc.time)}
          ${inner}
        </div>
      </div>
      <div class="phone-cap"><div class="n">${sc.n}</div><div class="t">${sc.t}</div></div>`;

    // hydrate tab bars
    wrap.querySelectorAll('.tabbar[data-nav]').forEach((tb) => {
      tb.innerHTML = tabbarHTML(parseInt(tb.dataset.nav, 10));
    });

    gallery.appendChild(wrap);
  });

  // ---- activity chart: period switching ----
  document.querySelectorAll('[data-period-seg]').forEach((seg) => {
    const scope = seg.closest('.body-scroll') || seg.parentElement;
    const root  = scope.querySelector('[data-chart]');
    const lbl   = scope.querySelector('[data-period-label]');
    const km    = scope.querySelector('[data-stat-km]');
    const runs  = scope.querySelector('[data-stat-runs]');
    const pace  = scope.querySelector('[data-stat-pace]');
    const time  = scope.querySelector('[data-stat-time]');
    const btns  = [...seg.querySelectorAll('button')];
    function set(period) {
      const d = M.chartData[period];
      btns.forEach((b) => b.classList.toggle('on', b.dataset.period === period));
      lbl.textContent = d.label;
      km.innerHTML = d.km + '<span>km</span>';
      runs.textContent = d.runs;
      pace.textContent = d.pace;
      time.textContent = d.time;
      M.renderChart(root, period);
    }
    btns.forEach((b) => b.addEventListener('click', () => set(b.dataset.period)));
    set('month');
  });
})();

</script>
</body>
