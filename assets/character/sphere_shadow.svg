<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Shadow: transparent center-left → dark edges (universal, works on any base color) -->
    <radialGradient id="shadowGradient" cx="40%" cy="40%" r="70%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="80" fill="url(#shadowGradient)"/>
</svg>
