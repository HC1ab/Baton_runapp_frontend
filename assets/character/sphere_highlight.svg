<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Highlight: white specular at top-left (universal, works on any base color) -->
    <radialGradient id="highlightGradient" cx="35%" cy="35%" r="55%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="75" cy="72" rx="36" ry="30" fill="url(#highlightGradient)"/>
</svg>
