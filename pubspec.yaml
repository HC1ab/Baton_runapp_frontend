name: runapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3      # ✅ iOS 지원 확인됨
  flutter_svg: ^2.0.10+1          # ✅ iOS 지원 확인됨 (SVG 렌더링)

  # State management
  flutter_riverpod: ^3.1.0        # ✅ iOS 지원 확인됨
  riverpod_annotation: ^4.0.0     # ✅ iOS 지원 확인됨

  # Navigation
  go_router: ^17.2.3              # ✅ iOS 지원 확인됨

  # Network
  dio: ^5.9.0                     # ✅ iOS 지원 확인됨

  # Storage
  flutter_secure_storage: ^10.2.0  # ✅ iOS 지원 확인됨
  shared_preferences: ^2.3.3       # ✅ iOS 지원 확인됨 (간단한 설정값 저장)

  # Logging
  logger: ^2.5.0                  # ✅ iOS 지원 확인됨

  # Code generation
  freezed_annotation: ^3.0.0      # ✅ custom_lint 0.7.4+ 요구 버전으로 업그레이드
  json_annotation: ^4.9.0         # ✅ iOS 지원 확인됨

  # Map & Location
  google_maps_flutter: ^2.9.0                    # ✅ Android/iOS 통합 지도 SDK
  google_maps_flutter_android: ^2.0.0            # Android renderer 초기화 (LATEST renderer 전환용)
  google_maps_flutter_platform_interface: ^2.0.0 # GoogleMapsFlutterPlatform 접근용
  geolocator: ^14.0.2             # ✅ iOS 지원 확인됨 (Info.plist 키 추가 필요)
  permission_handler: ^12.0.1     # ✅ iOS 지원 확인됨 (Info.plist 키 추가 필요)
  flutter_compass: ^0.8.0         # ✅ iOS/Android 지원 (NSMotionUsageDescription 필요)
  geocoding: ^4.0.0               # ✅ iOS 지원 확인됨 (역지오코딩 — 좌표→주소)

  # Env
  flutter_dotenv: ^6.0.1          # ✅ iOS 지원 확인됨 (.env 파일 로드)

  # Utils
  intl: ^0.20.2                   # ✅ iOS 지원 확인됨
  blurhash_dart: ^1.2.1           # ✅ iOS 지원 확인됨
  stomp_dart_client: ^3.0.1
  model_viewer_plus: 1.10.0          # ✅ Android/iOS — GLB 3D 렌더 (WebView)
  webview_flutter: ^4.10.0           # model_viewer_plus WebViewController 직접 참조용

  #firebase 배포
  firebase_core: ^2.10.0         # ✅ iOS 지원 확인됨

  #kakao
  kakao_flutter_sdk_user: ^1.9.6

  # Run Share
  image_picker: ^1.1.2   # ✅ iOS 지원 — 갤러리 배경이미지 선택
                           # [iOS] NSPhotoLibraryUsageDescription Info.plist 필요
  gal: ^1.3.0             # ✅ iOS/Android — 갤러리에 이미지 저장
                           # [iOS] NSPhotoLibraryAddUsageDescription Info.plist 필요

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0                 # freezed_annotation 3.x 에 맞는 버전
  json_serializable: ^6.9.5
  riverpod_generator: ^4.0.0+1      # flutter_riverpod 2.x 에 맞는 버전
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0           # flutter_riverpod 2.x 에 맞는 버전

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.prod
    - assets/images/spot_default.png
    - assets/images/spot_checked.png
    - assets/images/test_charactor.png
    - assets/character/
    - assets/models/
